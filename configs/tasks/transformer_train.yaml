TransformerTrain:
  _target_: chess_gnn.tasks.TransformerTrain
  compile_model: False
  model:
    _target_: chess_gnn.models.ChessTransformer
    encoder:
      _target_: torch.nn.TransformerEncoder
      num_layers: 10
      encoder_layer:
        _target_: torch.nn.TransformerEncoderLayer
        batch_first: True
        d_model: &encoder_dim
          512
        nhead: 8
        dim_feedforward: 2048
        dropout: 0.
      norm:
        _target_: torch.nn.LayerNorm
        normalized_shape: *encoder_dim
    decoder:
      _target_: torch.nn.TransformerDecoder
      decoder_layer:
        _target_: torch.nn.TransformerDecoderLayer
        batch_first: True
        d_model: 384
        nhead: 8
        dim_feedforward: 1536
        dropout: 0.
      num_layers: 2
    mask_handler:
      _target_: chess_gnn.bert.TransformerMaskHandler
      masking_ratio: &masking_ratio
        0.15
    optimizer_factory:
      _target_: chess_gnn.optimizers.LambFactory
      learning_rate: 1e-3
      weight_decay: 1e-2
    lr_scheduler_factory:
      _target_: chess_gnn.schedules.StepLRFactory
      step_size: 20_000
      interval: 'step'
      gamma: 0.90
    masking_schedule:
      _target_: chess_gnn.schedules.MaskingSchedule
      start_ratio: *masking_ratio
      end_ratio: 0.30
      ratio_step: 0.01
      step: 10_000
    square_weights:
      _target_: chess_gnn.models.SquareWeights
      no_weights: True
  datamodule:
    _target_: chess_gnn.data.ChessDataModule
    data_directory: '/home/ray/datasets/chess/lumbras_2024_with_draws_transformer'
    batch_size: 1024
    num_workers: 8
    mode: 'transformer'
  trainer_factory:
    _target_: chess_gnn.trainer.TrainerFactory
    log_every_n_steps: 500
    max_steps: 175_000
    accelerator: 'auto'
    strategy: 'auto'
    devices: 1
    precision: "bf16-mixed"
    val_check_interval: 2500
    limit_val_batches: 2500
    num_sanity_val_steps: 10
    callbacks:
      - _target_: pytorch_lightning.callbacks.TQDMProgressBar
      - _target_: pytorch_lightning.callbacks.LearningRateMonitor
        logging_interval: 'step'
      - _target_: pytorch_lightning.callbacks.ModelCheckpoint
        _partial_: True
        monitor: 'val_all_loss'
        mode: 'min'
        save_top_k: 2
        save_last: True
        every_n_train_steps: 10_000